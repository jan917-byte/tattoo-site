backend:
  name: github
  repo: jan917-byte/tattoo-site
  branch: main
  base_url: https://api.netlify.com    # Netlify gère l'OAuth GitHub

media_folder: public/uploads
public_folder: /uploads

locale: fr

collections:

  # ── FLASHS ──────────────────────────────────────────────────────────────────
  - name: flash
    label: "Flashs disponibles"
    label_singular: "Flash"
    folder: public/content/flash
    create: true
    slug: "{{slug}}"
    format: json
    sortable_fields: [order, date, title]
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Image", name: image, widget: image }
      - label: "Statut"
        name: available
        widget: select
        options:
          - { label: "Disponible ✅", value: available }
          - { label: "Réservé 🔒", value: booked }
          - { label: "Déjà tatoué ❌", value: taken }
        default: available
      - label: "Afficher sur la page principale"
        name: show_on_homepage
        widget: boolean
        default: true
        hint: "Si activé, ce flash apparaît dans la section Flash de la page d'accueil (uniquement si statut Disponible)."
      - { label: "Taille estimée", name: size, widget: string, required: false,
          hint: "Ex : 5×5 cm, 10×15 cm" }
      - { label: "Notes / prix", name: notes, widget: text, required: false }
      - { label: "Date d'ajout", name: date, widget: datetime }
      - { label: "Ordre d'affichage", name: order, widget: number, required: false,
          value_type: int, min: 0, step: 1,
          hint: "Plus petit = affiché en premier (1, 2, 3...). Laisser vide pour classer par date (plus récent en premier)." }

  # ── TATTOOS RÉALISÉS (portfolio) ────────────────────────────────────────────
  - name: tattoos
    label: "Tattoos réalisés"
    label_singular: "Tattoo"
    folder: public/content/tattoos
    create: true
    slug: "{{slug}}"
    format: json
    sortable_fields: [order, date, title]
    fields:
      - { label: "Titre / description courte", name: title, widget: string }
      - { label: "Photo principale", name: image, widget: image }
      - label: "Style"
        name: style
        widget: select
        options:
          - { label: "Flash", value: flash }
          - { label: "Projet", value: project }
          - { label: "Freehand", value: freehand }
      - label: "Afficher sur la page principale"
        name: show_on_homepage
        widget: boolean
        default: true
        hint: "Si activé, ce tattoo apparaît dans la section Recent works de la page d'accueil."
      - { label: "Date", name: date, widget: datetime }
      - { label: "Notes (optionnel)", name: notes, widget: text, required: false }
      - { label: "Ordre d'affichage", name: order, widget: number, required: false,
          value_type: int, min: 0, step: 1,
          hint: "Plus petit = affiché en premier (1, 2, 3...). Laisser vide pour classer par date (plus récent en premier)." }

  # ── ART / SCULPTURE ─────────────────────────────────────────────────────────
  - name: art
    label: "Art / Sculpture"
    label_singular: "Œuvre"
    folder: public/content/art
    create: true
    slug: "{{slug}}"
    format: json
    sortable_fields: [order, date, title]
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Image principale", name: image, widget: image }
      - label: "Type"
        name: type
        widget: select
        options:
          - { label: "Sculpture", value: sculpture }
          - { label: "Peinture", value: painting }
          - { label: "Dessin (original encadré)", value: drawing }
          - { label: "Print (tirage papier)", value: print }
          - { label: "Autre", value: other }
      - { label: "Dimensions / matériaux", name: details, widget: string, required: false }
      - { label: "Date de création", name: date, widget: datetime }
      - { label: "À vendre ?", name: for_sale, widget: boolean, default: false }
      - { label: "Prix en euros (originaux/dessins seulement)", name: price, widget: string, required: false,
          hint: "Nombre seul, ex : 150. Les prints n'ont pas de prix individuel : leur tarif est calculé selon la grille de quantité (1=15€, 2=25€, …)." }
      - { label: "Ordre d'affichage", name: order, widget: number, required: false,
          value_type: int, min: 0, step: 1,
          hint: "Plus petit = affiché en premier (1, 2, 3...). Laisser vide pour classer par date (plus récent en premier)." }

  # ── PAGES (contenus éditables) ──────────────────────────────────────────────
  - name: pages
    label: "Pages du site"
    files:
      - name: about
        label: "Page About"
        file: public/content/about.json
        format: json
        fields:
          - { label: "Titre de la page", name: page_title, widget: string, default: "About" }
          - { label: "Photo de l'artiste", name: photo, widget: image, required: false,
              hint: "Format portrait conseillé (3/4). Laisser vide pour afficher un cadre gris." }
          - { label: "Titre section artiste", name: artist_title, widget: string, default: "The artist" }
          - { label: "Bio", name: bio, widget: text,
              hint: "Laisser une ligne vide entre deux paragraphes." }
          - { label: "Titre section hygiène", name: hygiene_title, widget: string, default: "Hygiene & safety" }
          - label: "Points hygiène & sécurité"
            name: hygiene_points
            widget: list
            field: { label: "Point", name: point, widget: string }
          - { label: "Titre section studio", name: studio_title, widget: string, default: "Studio" }
          - { label: "Nom du studio", name: studio_name, widget: string }
          - { label: "Adresse", name: studio_address, widget: text,
              hint: "Une ligne par ligne d'adresse." }
          - { label: "Titre section FAQ", name: faq_title, widget: string, default: "FAQ" }
          - label: "FAQ"
            name: faq
            widget: list
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Réponse", name: answer, widget: text }
